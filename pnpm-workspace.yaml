packages:
  - 'examples/*'
  - 'packages/*'

saveExact: true
linkWorkspacePackages: true
preferWorkspacePackages: true
verifyDepsBeforeRun: 'install'

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
- '@ston-fi/*'

catalog:
  '@arethetypeswrong/cli': 0.18.2
  'esbuild-analyzer': 0.2.0
  'publint': 0.3.15
  'vitest': 3.2.4
  'tsup': 8.3.5

allowBuilds:
  '@ston-fi/api': false
  '@tailwindcss/oxide': false
  core-js-pure: false
  esbuild: false
  lefthook: true
  sharp: false
  unrs-resolver: false
